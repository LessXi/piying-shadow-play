<!doctype html>
<html><head><meta charset="utf-8"><title>shadow map viz</title>
<style>html,body{margin:0;background:#000;display:flex}</style></head>
<body>
<canvas id="c" width="480" height="270"></canvas>
<canvas id="m" width="480" height="270"></canvas>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeFabricTexture, makeAlphaFromDraw } from '../src/textures.js';
import { Stage } from '../src/stage.js';
import { Renderer } from '../src/renderer.js';
import { WaveScreen } from '../src/screen.js';
import { markShadowCaster } from '../src/materials.js';

function mk(canvas) {
  const renderer = new Renderer(canvas, { width: 480, height: 270, pixelRatio: 1 });
  const stage = new Stage({ screenWidth: 4, screenHeight: 2.5, lightFar: 12 });
  renderer.scene.add(stage.group);
  const fabric = makeFabricTexture(256);
  const screen = new WaveScreen({ width: 4, height: 2.5, segX: 40, segY: 24, fabric });
  screen.bindRenderer(renderer);
  renderer.scene.add(screen.mesh);
  screen.attachLight(stage.light, { lightFar: 12, shadowSize: 512 });
  return { renderer, stage, screen };
}

const A = mk(document.getElementById('c'));
const B = mk(document.getElementById('m'));

// 两边都加同一个演员
function addActor(o) {
  const tex = makeAlphaFromDraw((ctx, w, h) => {
    ctx.beginPath();
    ctx.moveTo(w * 0.36, h * 0.94); ctx.lineTo(w * 0.42, h * 0.25);
    ctx.lineTo(w * 0.58, h * 0.25); ctx.lineTo(w * 0.64, h * 0.94); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.5, h * 0.19, w * 0.13, 0, Math.PI * 2); ctx.fill();
  }, { w: 128, h: 192, baseColor: '#1b0d06', glow: 0.5 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.55),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.45, side: THREE.DoubleSide, toneMapped: false }));
  markShadowCaster(m, tex, { alphaTest: 0.45, lightFar: 12 });
  m.position.set(-0.6, -1.24, -0.16);
  o.renderer.scene.add(m);
  return m;
}
addActor(A); const actorB = addActor(B);

// B: 用调试模式 9 显示 shadow map 采样
B.screen.setDebugMode(9);

let t = 0;
function loop() {
  requestAnimationFrame(loop);
  t += 1 / 60;
  for (const o of [A, B]) {
    o.screen.update(1 / 60, o.stage.light, o.renderer.camera);
    o.screen.renderShadow(o.renderer.scene);
    o.renderer.render(1 / 60);
  }
  window.__info = {
    t,
    bCasters: B.screen.shadowCasterCount,
    aStats: A.screen.shadowStage.readStats(A.renderer.renderer),
  };
}
loop();

window.__READY__ = true;
window.__qa = () => window.__info;
window.__snapshot = () => document.getElementById('c').toDataURL('image/png');
</script>
</body></html>
