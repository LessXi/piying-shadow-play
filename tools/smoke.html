<!doctype html>
<html><head><meta charset="utf-8"><title>webgl smoke</title><style>html,body{margin:0;background:#111}canvas{display:block}</style></head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<script>
const c = document.getElementById('c');
const gl = c.getContext('webgl2') || c.getContext('webgl');
window.__smoke = { ok: false };
if (gl) {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  window.__smoke = {
    ok: true,
    version: gl.getParameter(gl.VERSION),
    renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    depthTex: !!gl.getExtension('WEBGL_depth_texture') || !!gl.getExtension('EXT_color_buffer_float'),
  };
  gl.clearColor(0.95, 0.75, 0.35, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, 'precision mediump float;void main(){gl_FragColor=vec4(0.1,0.05,0.02,1.);}'); gl.compileShader(fs);
  const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, 0,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  window.__smoke.shaderOk = gl.getProgramParameter(pr, gl.LINK_STATUS);
}
</script>
</body></html>
